name: MFOS standalone sanity report - CORE,MANAGE,DISCOVERY

on:
  repository_dispatch:
    types: [trigger-workflow]
  pull_request:
    types:
      - opened
      - synchronize
    branches: [ next ]
jobs:
  RunStandaloneTests:
    if: vars.IGNORE_MFOS != 'true'
    permissions:
      contents: read       # checkout
      pull-requests: write # PR updates
      # don’t hit the gh api calls, don’t need actions: read.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

       # Set the branch if the workflow is triggered from external
      - name: Set PR Branch based on the trigger
        id: set-pr-branch
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "OPENRPC_PR_BRANCH='${{ github.event.client_payload.OPENRPC_PR_BRANCH }}'" >> $GITHUB_ENV  # Set from payload
          else
            echo "OPENRPC_PR_BRANCH=''" >> $GITHUB_ENV  # Clear the variable for other events
          fi

      # Install Chrome. On GitHub-hosted runners google-chrome-stable is already
      # present. On stripped act images it must be installed via the Google repo.
      # Using the system Chrome sidesteps puppeteer's managed-download entirely,
      # so there is no need to maintain a manual list of shared-library deps.
      - name: Install Chrome
        run: |
          if ! command -v google-chrome-stable &>/dev/null; then
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
              | gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg >/dev/null
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] \
              http://dl.google.com/linux/chrome/deb/ stable main" \
              | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -q
            sudo apt-get install -y google-chrome-stable xvfb x11-utils
          elif ! command -v Xvfb &>/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y xvfb x11-utils
          fi

      # Run tests
      - name: Run Core Manage and Discovery tests and create assets
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INTENT: ${{ vars.INTENT }}
          OPENRPC_PR_BRANCH: ${{ env.OPENRPC_PR_BRANCH }} # Comes from OPENRPC repo if triggered externally
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
        run: |
          ./.github/workflows/utils.sh runTests

      - name: Upload report.json as an artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: report
          path: ${{ github.workspace }}/report

      - name: Get results from report.json
        run: |
          ./.github/workflows/utils.sh getResults
