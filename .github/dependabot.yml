version: 2
updates:
  # Root package — covers all npm workspace members (core, manage, discovery)
  # via the single root package-lock.json. Per-workspace entries are intentionally
  # omitted to avoid lockfile mismatches.
  # src/js/production-changelog has no npm dependencies, so no entry is needed.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # These advisories affect brace-expansion@5.0.4 and picomatch@4.0.3 which are
    # bundledDependencies inside npm@11.12.1 (the latest npm@11 as of this writing).
    # They cannot be fixed without a patch release from the npm project itself.
    # They only exist inside @semantic-release/npm, a CI-only devDependency, and
    # are not reachable from the published SDK. Suppress until npm@11 ships a fix.
    ignore:
      - dependency-name: "brace-expansion"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "picomatch"
        update-types: ["version-update:semver-patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
