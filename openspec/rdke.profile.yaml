name: rdke
# Hierarchical composition profile for the RDKe Firebolt SDK.
#
# Layers are ordered highest-priority first (first-wins merge per method name).
# Graduate a module by:
#   1. Adding its Smithy draft to openspec/specs/smithy/ (generated by fb-gen --lang smithy).
#   2. Moving it from the openrpc-upstream layer to smithy-canonical by listing it under
#      `modules:` in the smithy-canonical layer and adding it to the `exclude:` list in
#      openrpc-upstream.
#   3. Running `fb-gen --transition-status` and `compliance/run.sh` to confirm graduation.

# ── Profile-level metadata ─────────────────────────────────────────────────────
metadata:
  # Emit a legacy inline alias for every subscribable-property subscribe method so
  # that bespoke callsites using subscribeOnXxxChanged() continue to compile against
  # the generated headers without any source changes.
  event_property_suffix: Changed

# Platform-specific spec patches (type renames, scalar overrides, etc.)
# resolved relative to this file.
quirks_file: rdke.quirks.toml

layers:
  # ── Graduated modules (canonical Smithy spec) ─────────────────────────────
  - name: smithy-canonical
    path: ../src/smithy
    format: smithy
    modules:
      # Graduated — fully self-contained Smithy specs:
      - actions
      - accessibility
      - advertising
      - capabilities
      - closedcaptions
      - content
      - device
      - discovery
      - lifecycle
      - localization
      - metrics
      - profile
      - secondscreen
      - usergrants
      - voiceguidance
      - wifi
      - account
      - acknowledgechallenge
      - audiodescriptions
      - authentication
      - hdmiinput
      - keyboard
      - parameters
      - pinchallenge
      - privacy
      - securestorage
      - text_to_speech

  # ── Remaining modules (upstream OpenRPC, pending graduation) ──────────────
  - name: openrpc-upstream
    path: ../../firebolt-js-client/src/openrpc
    filter:
      methods:
        exclude: []   # add module-specific exclusions here as methods graduate
