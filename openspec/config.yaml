schema: spec-driven

context: |
  ## Project: firebolt-apis

  This is the **Firebolt API specification repo**. It contains the canonical Smithy 2.0
  specs for every Firebolt API module. SDK code (C++, Rust, TypeScript) is generated
  automatically from these specs by `firebolt-sdk-gen` — you never edit generated code here.

  ### Repo layout

  ```
  src/
    smithy/       ← canonical Smithy 2.0 IDL specs (one .smithy file per module)
    openrpc/      ← upstream OpenRPC JSON (reference/fallback — do not hand-edit)
    schemas/      ← shared JSON Schema definitions ($ref targets)
  openspec/
    changes/      ← in-flight API changes (proposals, designs, tasks)
  ```

  ### What "making a change" means here

  An API change means adding or modifying a `.smithy` Smithy IDL file under `src/smithy/`.
  The SDKs are downstream — they regenerate automatically from the spec.

  Changes fall into two categories:
  - **New module**: a new `src/smithy/<module>.smithy` file + entry in the profile.
  - **Module change**: adding/modifying operations or types in an existing `src/smithy/<module>.smithy`.

  ### Smithy spec format

  All specs use **Smithy 2.0 IDL** (`.smithy`) format. Each file is a single IDL text file:
  ```smithy
  $version: "2"
  namespace com.firebolt.<module>

  use com.firebolt#propertyReadonly

  service <Module>Service {
      version: "1.0"
      operations: [myOp]
  }

  @propertyReadonly
  operation myOp {
      input: MyOpInput
      output: MyOpOutput
  }

  structure MyOpInput {}

  structure MyOpOutput {
      @required
      value: String
  }
  ```

  Namespace convention: `com.firebolt.<modulename>` (all lowercase).

  Service shape name: `<ModuleName>Service` (PascalCase + "Service").

  **Do not create `.json` Smithy JSON AST files** — the IDL is the canonical source.
  JSON AST is a generated/transient format used internally by tooling.

  ### Method tags (Firebolt traits)

  Applied as Smithy traits on operation shapes. Choose the right tag:

  | Trait | When to use |
  |-------|-------------|
  | `com.firebolt#propertyReadonly` | Read-only property: getter + subscribe. Most common for device/platform state. |
  | `com.firebolt#property` | Read-write property: getter + setter + subscribe. Use when the app can change the value. |
  | `com.firebolt#propertyImmutable` | Factory-assigned, never changes at runtime (e.g. device ID, model). Getter only. |
  | `com.firebolt#event` | Push notification (no getter). Use when the platform initiates. |
  | `com.firebolt#excludeFromSdk` | Internal/private — exists in spec but not exposed in generated SDK. |
  | _(no trait)_ | Plain RPC call: request/response. Use for actions (e.g. `launch`, `speak`, `clear`). |

  ### Type conventions

  - **Integers**: always specify format. Use `com.firebolt#UInt32` for unsigned 32-bit,
    `smithy.api#Integer` (int32) for signed. Never use bare `smithy.api#Integer` for
    counts or IDs that can't be negative.
  - **Strings**: `smithy.api#String`. For enum-like strings, define a proper `enum` shape.
  - **Booleans**: `smithy.api#Boolean`.
  - **Optional fields**: omit `smithy.api#required` trait — absence means optional.
  - **Required fields**: apply `"smithy.api#required": {}` trait.
  - **Lists**: define a named `list` shape (e.g. `ResolutionList`) — don't inline.
  - **Maps**: `com.firebolt#BooleanMap` or define a named `map` shape.

  ### Naming conventions

  - Module name: `lowercase` (file: `voiceassistant.json`, namespace: `com.firebolt.voiceassistant`)
  - Service: `VoiceAssistantService`
  - Operations: `camelCase` (e.g. `speak`, `getRate`, `onSpeechStarted`)
  - Shapes/types: `PascalCase` (e.g. `SpeechResult`, `VoiceGuidanceSettings`)
  - Input/Output wrappers: `<OperationName>Input` / `<OperationName>Output`
  - Do NOT prefix type names with the module name (use `Rate` not `VoiceAssistantRate`)

  ### Backward compatibility rules

  - **Never remove** an operation or field from a published spec.
  - **Never rename** an existing operation or field.
  - **Never change** a required field to optional or vice versa.
  - **Adding** new optional fields or new operations is always safe.
  - **Adding** new enum variants is safe.

  ### Capability model

  Each non-trivial API operation should be associated with a Firebolt capability.
  Capabilities are declared via `x-uses`, `x-manages`, or `x-provides` in the OpenRPC
  source. For Smithy specs, document the capability association in the operation's
  `smithy.api#documentation` trait if applicable.

  ### Tooling (available on your workstation)

  Environment variables expected:
  - `FB_SPEC_DIR` — set to `src/smithy/` (relative to this repo root) for `fb-mcp`
  - `FB_SDK_GEN` — path to the `firebolt-sdk-gen` repo (default: `../firebolt-sdk-gen`)

  Key commands (all assume `FB_SDK_GEN` sibling directory):
  ```bash
  # Validate a spec file (parse + lint, no side effects)
  fb-gen --lint --input src/smithy/<module>.json

  # Get a human-readable IR summary of a module
  fb-gen --input src/smithy/<module>.json --report

  # Get machine-readable IR (for AI/tooling)
  fb-gen --input src/smithy/<module>.json --report --json 2>/dev/null

  # Check a new module against upstream OpenRPC for drift
  fb-gen --diff --smithy src/smithy/ --openrpc src/openrpc/

  # Generate C++ bindings to verify (doesn't affect this repo)
  fb-gen --input src/smithy/<module>.json --output /tmp/check-<module>/ --lang cpp
  ```

  `fb-mcp` is an MCP server — it is not called directly. When configured in your editor's
  `mcp.json` with `FB_SPEC_DIR=src/smithy`, it exposes these tools to AI agents:
  `list_modules`, `get_module`, `validate_module`, `generate`, `diff_vs_upstream`.

  ### What a good spec change looks like

  A complete spec change includes:
  1. The modified or new `src/smithy/<module>.smithy` file
  2. A passing `fb-gen --lint` run
  3. A passing `fb-gen --diff` showing no unintended upstream delta
  4. (For new modules) an entry added to the appropriate profile YAML in `firebolt-sdk-gen`

  ### Design decision: `rdke.quirks.toml` is a transitional debt register

  **Decision (2026-05-05):** `rdke.quirks.toml` is not a permanent feature — it is a
  transitional debt register. Every entry represents spec debt that must be resolved
  before the migration to Smithy IDL as canonical source is complete.
  A zero-entry quirks file is the definition of done for the migration.

  **Quirk entry taxonomy:**

  | Category | Correct fate |
  |---|---|
  | Spec bug (upstream said `number`, should be `uint32`) | Fix in the Smithy IDL directly; delete the quirk entry |
  | Bad identifier (`dolbyDigital5.1` → `dolbyDigital51`) | Use the correct name in the `.smithy` file from day one; delete the quirk entry |
  | Type rename (`HDRFormatMap` → `HDRFormat`) | Use the correct name in the `.smithy` shape; delete the quirk entry |
  | Platform behavioral deviation (platform genuinely returns a different type than the spec) | Keep the quirk entry, but document *why* with a comment. If expressible in Smithy (e.g. `@documentation` or a `UInt32` member type), prefer encoding it there and deleting the quirk. |

  **For new modules:** generate a draft with `fb-gen --lang smithy-idl`, fix identifiers
  and type issues directly in the `.smithy` file, and do not add quirk entries to compensate
  for spec bugs — fix them in the source instead.

  ### Key commands

  ```bash
  # Generate C++ bindings from the canonical IDL specs
  fb-gen --profile openspec/rdke.profile.yaml --lang cpp --emit bindings --output /tmp/gen/

  # Regenerate IDL from scratch (e.g. to verify roundtrip)
  fb-gen --profile openspec/rdke.profile.yaml --lang smithy-idl --emit bindings --output src/smithy/

  # Check a module against upstream OpenRPC for drift
  fb-gen --diff --smithy src/smithy/ --openrpc src/openrpc/

  # Validate composition (dry-run, no output written)
  fb-gen --profile openspec/rdke.profile.yaml --dry-run
  ```
