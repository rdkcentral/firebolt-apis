# rdke.quirks.toml — RDKe platform spec overrides
#
# Applied after the IR is lowered, before any backend emits code.
# Purpose: keep the generated C++ API surface drop-in compatible with the
# hand-written firebolt-cpp-client (bespoke) headers that existing callsites
# were written against.
#
# ── DESIGN DECISION: this file is a transitional debt register ────────────────
# Every entry here is spec debt. The migration goal is zero entries.
#
# When adding an entry, classify it:
#   [spec-bug]      Upstream OpenRPC has a wrong type. Fix in the Smithy IDL
#                   directly when that module graduates; then delete this entry.
#   [bad-ident]     Upstream uses an invalid identifier (e.g. "dolbyDigital5.1").
#                   Use the correct name in the .smithy file; delete this entry.
#   [platform-dev]  The RDKe platform genuinely deviates from the Firebolt spec.
#                   Document WHY. Prefer encoding in Smithy if possible; otherwise
#                   keep this entry with a clear justification comment.
#
# A zero-entry file = migration complete.
# ─────────────────────────────────────────────────────────────────────────────
#
# Reference: SPEC_OVERRIDES.md for the full decision flowchart.

# ── Method result type overrides ──────────────────────────────────────────────
# The upstream spec uses "number" (→ double) for time values, but the bespoke
# SDK returned uint32_t.  Callers pass these to APIs expecting unsigned ints.
[method_result_overrides]
# [spec-bug] Upstream uses "number" (double) for uptime; platform returns uint32_t.
# Fix: when Device graduates to a hand-authored .smithy, use `UInt32` as the result type.
"Device.uptime"            = "uint32"
# [spec-bug] Same as uptime — "number" in spec, uint32_t in practice.
"Device.timeInActiveState" = "uint32"

# ── Type renames ──────────────────────────────────────────────────────────────
# Rename generated struct/enum names to match what bespoke callsites use.
# Each key is "ModuleName.GeneratedTypeName", value is the bespoke name.
[type_renames]
# [spec-bug] Upstream renamed the HDR struct to HDRFormatMap; bespoke uses HDRFormat.
# Fix: name the shape HDRFormat in the .smithy file.
"Device.HDRFormatMap"              = "HDRFormat"
# [platform-dev] Stats module uses MemoryInfo name from the RDKe platform API surface.
# Upstream calls it MemoryUsage. Both refer to the same data; platform name takes precedence.
"Stats.MemoryUsage"                = "MemoryInfo"
# [spec-bug] Upstream result struct is AdvertisingIdResult; bespoke uses shorter Ifa name.
# Fix: name the shape Ifa in the .smithy file.
"Advertising.AdvertisingIdResult"  = "Ifa"
# [platform-dev] Display module exposes Size and MaxResolution as a single DisplaySize type
# for drop-in compat with bespoke callsites. Both shapes are structurally identical.
"Display.Size"                     = "DisplaySize"
"Display.MaxResolution"            = "DisplaySize"

# ── Struct field type overrides ───────────────────────────────────────────────
# Change individual struct field types.
# Each key is "ModuleName.StructName.fieldName", value is the target scalar.
[field_type_overrides]
# [spec-bug] Stats: MemoryInfo fields are physically unsigned — bespoke exposed uint32_t.
# Fix: use UInt32 field types in the Stats .smithy file.
"Stats.MemoryInfo.userMemoryUsed"  = "uint32"
"Stats.MemoryInfo.userMemoryLimit" = "uint32"
"Stats.MemoryInfo.gpuMemoryUsed"   = "uint32"
"Stats.MemoryInfo.gpuMemoryLimit"  = "uint32"
# [spec-bug] TextToSpeech: SpeechId is a non-negative handle; bespoke used uint32_t.
# Fix: use UInt32 in the TextToSpeech .smithy file.
"Texttospeech.SpeechIdEvent.speechid" = "uint32"
"Texttospeech.SpeechResponse.speechid"  = "uint32"
# [platform-dev] Display: pixel/cm dimensions are non-negative; bespoke used uint32_t.
# (Note: Size and MaxResolution are both renamed to DisplaySize above)
"Display.Size.width"               = "uint32"
"Display.Size.height"              = "uint32"
"Display.MaxResolution.width"      = "uint32"
"Display.MaxResolution.height"     = "uint32"
